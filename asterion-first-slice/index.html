<!doctype html>
<html lang="en">
<head>

<title>Asterion | The Living Labyrinth · First Playable Slice</title>
<style>
:root{--ink:#e8e1d6;--soft:#aab1b2;--gold:#dfbb83;--line:#8e745540;--panel:#0c141be8;--bottom:env(safe-area-inset-bottom,0px);--top:env(safe-area-inset-top,0px);color-scheme:dark}
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#070c12;color:var(--ink);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button{font:inherit;cursor:pointer;color:inherit}button:focus-visible{outline:2px solid var(--gold);outline-offset:3px}button:disabled{cursor:default;opacity:.5}
#app{height:100%;height:100dvh;position:relative;isolation:isolate;overflow:hidden;background:radial-gradient(ellipse 65% 50% at 55% 40%,#1c3034aa,transparent 75%),linear-gradient(160deg,#101c23,#070d14 75%)}
.labyrinth{position:absolute;inset:0;overflow:hidden;z-index:-1;pointer-events:none;transition:filter .8s,background .8s;background:repeating-linear-gradient(90deg,transparent 0 42px,#bba07307 43px 45px,transparent 47px 90px),repeating-linear-gradient(0deg,transparent 0 73px,#bb9b6609 75px 77px,transparent 79px 146px)}
.labyrinth:before{content:"";position:absolute;inset:-22%;background:repeating-radial-gradient(ellipse at 55% 60%,transparent 0 38px,#a9906e18 39px 42px,transparent 45px 100px);transform:perspective(480px) rotateX(42deg);opacity:.35;transition:transform 1.2s,opacity 1.2s}
.labyrinth:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#04080cf0,transparent 23%,transparent 78%,#050a0edf),linear-gradient(0deg,#060b10dd,transparent 35%);}
.wall{position:absolute;top:-15%;bottom:-15%;width:2px;background:linear-gradient(transparent,#b8986855,transparent);transform:rotate(14deg);transition:transform 1.2s,left 1.2s,opacity 1.2s;opacity:.4}
.wall.a{left:17%}.wall.b{left:68%;transform:rotate(-17deg)}.wall.c{left:86%;transform:rotate(8deg)}
.labyrinth[data-maze="sealed"]:before,.labyrinth[data-maze="redirecting"]:before{transform:perspective(480px) rotateX(42deg) translateX(-110px);opacity:.58}
.labyrinth[data-maze="sealed"] .wall.a{left:43%;transform:rotate(44deg);opacity:.9}.labyrinth[data-maze="sealed"] .wall.b{left:55%;transform:rotate(-40deg);opacity:.9}
.labyrinth[data-maze="awake"]{filter:brightness(1.2)}.labyrinth[data-maze="awake"] .wall.c{left:52%;opacity:1}
.labyrinth[data-maze="thread-held"]:before{opacity:.7;transform:perspective(480px) rotateX(42deg) translateY(80px)}
.screen{position:relative;z-index:1;height:100%;display:flex;flex-direction:column;max-width:660px;margin:0 auto;background:linear-gradient(90deg,#0b1119bf,#0a141abe,#0a131ad9);border-left:1px solid #d3aa7016;border-right:1px solid #d3aa7016}
.home{padding:calc(var(--top) + 26px) 25px calc(var(--bottom) + 24px);justify-content:space-between;align-items:center;text-align:center;overflow-y:auto}
.home-brand,.eyebrow{font-size:10px;letter-spacing:.26em;font-weight:700;color:#c7aa7e;text-transform:uppercase}.home-body{margin:auto 0;width:100%}.seal{margin:0 auto 25px;width:min(47vw,200px);aspect-ratio:1;border:1px solid #ab875c80;border-radius:50%;display:grid;place-items:center;box-shadow:0 0 55px #d3b07d15,inset 0 0 44px #c69f6615;position:relative}.seal:before,.seal:after{content:"";position:absolute;inset:16px;border:1px dashed #b3915d70;border-radius:50%}.seal:after{inset:34px;border-style:solid;opacity:.6}.seal span{font-family:Georgia,serif;font-size:75px;color:var(--gold);line-height:1}.home h1{font-family:Georgia,serif;font-weight:400;letter-spacing:.16em;font-size:clamp(36px,11vw,65px);margin:0 0 5px}.home h2{font-weight:400;letter-spacing:.3em;font-size:11px;color:#c8a777;margin:0 0 24px}.home p{font:italic 16px/1.7 Georgia,serif;color:#c2c7c4;max-width:340px;margin:0 auto}.home-actions{width:100%;max-width:410px}.cta{min-height:52px;width:100%;border:1px solid #d1ac77;background:#cfac76;color:#111a1d;font-weight:800;font-size:12px;letter-spacing:.16em;padding:13px 18px}.secondary{border:1px solid #bba1755a;background:#0b141dc9;color:#d5c7b0;min-height:45px;font-size:12px;padding:10px 18px}.home-actions button+button{margin-top:10px}.small{font-size:11px;color:#89969a;line-height:1.6}
.top{padding:calc(var(--top) + 12px) 15px 10px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #8c785736;background:#0a1117dc;gap:12px;flex-shrink:0}.top button{border:1px solid #927f6054;background:#0c1820;color:#cbb38d;border-radius:3px;padding:8px 10px;font-size:11px}.top-title{text-align:center;min-width:0}.top-title strong{display:block;font:20px Georgia,serif;letter-spacing:.13em}.top-title span{font-size:9px;letter-spacing:.13em;color:#91a6a6}.statebar{display:flex;align-items:center;gap:8px;font-size:10px;color:#c4b18f;padding:10px 16px;border-bottom:1px solid #947d522b;background:#0c151bc9;min-height:39px}.light{width:6px;height:6px;border-radius:50%;background:#d0b685;box-shadow:0 0 12px #cda765}.statebar span:last-child{margin-left:auto;font-size:10px;color:#8f9da0;text-align:right}
.transcript{min-height:0;flex:1;overflow:auto;overscroll-behavior:contain;padding:22px 17px 18px;scrollbar-color:#73684e transparent}.msg{max-width:91%;margin:0 0 18px}.msg.player{margin-left:auto}.who{font-size:10px;letter-spacing:.13em;color:#d2ad78;margin:0 0 6px;font-weight:700}.msg.player .who{text-align:right;color:#9ab6bc}.bubble{font:16px/1.62 Georgia,serif;background:#142027e8;border:1px solid #455354a8;border-radius:3px 13px 13px 13px;padding:12px 14px;white-space:pre-wrap;overflow-wrap:anywhere}.msg.player .bubble{font:14px/1.58 system-ui,-apple-system,sans-serif;background:#28373bc9;border-radius:13px 3px 13px 13px}.msg.system{max-width:100%;text-align:center;color:#a9a28c;font-size:11px;letter-spacing:.04em;margin:20px 0}.msg.system .bubble{font:11px/1.7 system-ui,sans-serif;border:0;border-top:1px solid #ae946038;border-bottom:1px solid #ae946038;background:#0c1519b0;border-radius:0;padding:11px 13px}
.dock{flex-shrink:0;max-height:44%;overflow-y:auto;padding:12px 14px calc(var(--bottom) + 12px);background:linear-gradient(#0e1920f7,#081017f9);border-top:1px solid #ac966548}.dock-title{font-size:10px;letter-spacing:.17em;color:#bea578;font-weight:700;margin:3px 4px 10px}.choices{display:grid;gap:8px}.choice{text-align:left;border:1px solid #9d8e705e;background:#18252bdc;padding:12px 13px;font-size:13px;line-height:1.45;min-height:48px;border-radius:4px}.choice:hover,.secondary:hover{border-color:#ddbd88}.choice:active{background:#2d393b}.lore{margin-top:10px;padding:10px 0 0;border-top:1px solid #90785738}.linkbtn{border:0;background:transparent;color:#d9bc86;font-size:12px;padding:5px 1px;text-align:left}.question-list{display:grid;gap:6px;margin-top:8px}.question-list button{background:#111d23;border:1px solid #7e71543b;padding:9px;font-size:12px;text-align:left}
.away{padding:8px 3px 2px;color:#c9c0af;font-size:13px;line-height:1.6}.away strong{color:var(--gold)}.away .soft{font-size:11px;color:#9aabab}.debug{font-size:11px;border:1px dashed #9d7b57;background:transparent;color:#c8ad80;padding:8px;margin-top:8px}.epilogue{color:#d0c0a8;font:italic 15px/1.7 Georgia,serif;padding:4px 3px 12px}
@media(max-width:370px){.transcript{padding:14px 12px}.bubble{font-size:15px}.dock{padding:10px 11px calc(var(--bottom) + 9px)}.top-title strong{font-size:18px}.statebar{font-size:9px}}
.no-motion *, .no-motion *:before, .no-motion *:after{transition:none!important;animation:none!important}@media(prefers-reduced-motion:reduce){*,*:before,*:after{transition:none!important;animation:none!important}}
</style>
</head>
<body><div id="app"><div class="labyrinth" id="labyrinth" data-maze="still" aria-hidden="true"><div class="wall a"></div><div class="wall b"></div><div class="wall c"></div></div><main class="screen home" id="screen"></main></div>
<script id="asterion-engine">
(function(root){
'use strict';
const VERSION=1,MAX_WAIT=30*60*1000;
const FIRST='I\'m at the west wall. I heard footsteps beyond the turn, then the stone made a sound like it was trying to swallow them. I haven\'t moved.';
const ACTIONS={
  opening:[
    {id:'watch',label:'Approach the west passage carefully. Observe before touching anything.',minutes:3,depart:'I\'ll approach slowly. If there is something there, I want to see it before it sees me.',returns:'There was a torch alcove around the bend. Someone left a red thread tied to an iron hook. I have not touched it. The wall behind the hook shifted when I leaned closer.',stage:'alcove',maze:'watching',location:'torch alcove',flags:['thread_seen']},
    {id:'rush',label:'Take the shortest corridor before the walls move again.',minutes:1.5,depart:'That might work. I\'m going now, before I change my mind.',returns:'I took the short route. The arch closed behind me with a sound like teeth meeting. I\'m in a narrow gallery now, and the west passage is gone. I should have watched the floor.',stage:'sealed',maze:'sealed',location:'sealed gallery',flags:['gate_sealed']},
    {id:'listen',label:'Stay where you are. Listen for whoever is outside.',minutes:.75,depart:'All right. I\'ll stay quiet. The silence here is never quite empty.',returns:'There are two rhythms. One is footsteps. The other is stone sliding against stone, trying to keep pace. I think someone is approaching the western wall.',stage:'whisper',maze:'listening',location:'west threshold',flags:['heard_visitor']}
  ],
  alcove:[
    {id:'study',label:'Examine the thread without touching it.',minutes:2,depart:'I can get closer without taking it. I\'ll look for anything that feels like a trap.',returns:'The hook is fixed into a removable stone. Beneath it is a narrow gap that leads somewhere the thread does not. I still have not touched the thread. The wall sounds restless.',stage:'complete',maze:'redirecting',location:'torch alcove',flags:['bypass_found'],end:'You found a bypass without claiming the thread. The passage remains uncertain, but Asterion has a second route.'},
    {id:'take',label:'Take the thread, if you decide it is safe.',minutes:3,depart:'I don\'t know whether it is safe. But I want to know what choice it gives me. I\'ll take it carefully.',returns:'I took the thread and tied its end around my wrist. The moment I pulled it free, the opening behind me sealed. I have a way to follow now, but no way back through that arch.',stage:'complete',maze:'thread-held',location:'torch alcove',flags:['thread_held','gate_sealed'],end:'Asterion has the thread. The labyrinth reacted to his choice, and the retreat route is now closed.'},
    {id:'withdraw',label:'Leave the thread and return to the western wall.',minutes:1,depart:'Then I leave it. A route someone offers me does not have to become my only route.',returns:'I\'m back at the west wall. The thread is still hanging where I found it. Nothing followed me, though I heard the alcove close after I left.',stage:'complete',maze:'watching',location:'west threshold',flags:['thread_left'],end:'Asterion withdrew without the thread. The alcove may no longer be reachable by the same passage.'}
  ],
  sealed:[
    {id:'trace',label:'Follow the vibration along the floor.',minutes:4,depart:'The stone is humming under my feet. I\'ll follow it, but not into another blind arch.',returns:'I found a seam where the gallery meets a lower passage. The sound comes from beneath, not ahead. I can see a route down, but the wall above is still moving.',stage:'complete',maze:'redirecting',location:'lower passage',flags:['lower_route_found'],end:'The rushed approach led to a lower route and an altered map. Asterion never found the thread.'},
    {id:'force',label:'Try to force the closed arch open.',minutes:5,depart:'I won\'t smash my hands against it. I\'ll test the loose stones along the seam. If they won\'t move, I\'m not dying to prove a point.',returns:'The seam does move, but only sideways. I could not force the arch. I made a narrow gap wide enough to see a second chamber, and something on the other side heard me.',stage:'complete',maze:'awake',location:'sealed gallery',flags:['second_chamber_seen','visitor_alerted'],end:'Asterion refused the reckless part of the plan, opened a sightline, and alerted someone beyond the wall.'},
    {id:'waitstone',label:'Wait and listen for the arch to settle.',minutes:1,depart:'I\'ll wait a moment. If the labyrinth is changing, I would rather see where it settles.',returns:'The arch stayed shut. But the floor stopped vibrating, and I heard a chain lift somewhere above me. Waiting told me which way the mechanism moves.',stage:'complete',maze:'sealed',location:'sealed gallery',flags:['mechanism_heard'],end:'You learned the mechanism\'s direction, but the shortcut remains sealed. Asterion still has no thread.'}
  ],
  whisper:[
    {id:'follownoise',label:'Follow the approaching footsteps, carefully.',minutes:2,depart:'Someone could be there. I\'ll follow only as far as I can still find my way back.',returns:'I reached a side passage. A woman was standing beyond the corner, but she stepped away before I could speak. She left a length of red fiber caught in the stone.',stage:'complete',maze:'watching',location:'side passage',flags:['visitor_seen','red_fiber_seen'],end:'Asterion saw someone in the side passage. He has seen red fiber, not the thread from the alcove.'},
    {id:'knock',label:'Knock once and see whether anyone answers.',minutes:1,depart:'Once. Not twice. There is no reason to tell the whole place where I am.',returns:'I knocked once. The reply came from inside the wall, not the corridor. Three knocks, evenly spaced. The stone beside me has started to move.',stage:'complete',maze:'awake',location:'west threshold',flags:['wall_answered'],end:'Something inside the wall answered. Asterion remains at the western threshold.'},
    {id:'hold',label:'Keep your position. Do not follow the sounds.',minutes:.5,depart:'I\'ll hold here. If someone wants me to move, they can tell me why.',returns:'The footsteps passed without stopping. I heard a door close beyond the bend. I stayed where I was, and for once the labyrinth changed without moving me.',stage:'complete',maze:'still',location:'west threshold',flags:['visitor_passed'],end:'Asterion stayed put. The unknown visitor passed, leaving the western passage quiet.'}
  ]
};
const HISTORY={
  why:{player:'Why are you here?',response:'I was brought here when I was too young to remember the road. People say this is where I belong. That is not the same as answering why.'},
  builder:{player:'Did Daedalus build this place?',response:'Daedalus likes to say he built every stone of it. He tells the story often enough that people believe him. But there are passages below this one that were old before I was born. I can tell you what I\'ve seen. I can\'t tell you who laid the first stone.'},
  proof:{player:'How can you tell those passages are older?',response:'The older walls join differently. Some markings are worn smooth where the newer doors were cut straight through them. I noticed because I have spent a lifetime touching these stones. That does not tell me who built them.'}
};
function copy(x){return JSON.parse(JSON.stringify(x));}
function append(s,who,text,time){s.log.push({id:++s.seq,who,text,at:time});}
function create(time){const s={version:VERSION,seq:0,stage:'opening',location:'west threshold',maze:'still',flags:[],thread:'none',asked:[],log:[],pending:null,completedActionIds:[],startedAt:time};append(s,'asterion',FIRST,time);return s;}
function valid(s){return s&&s.version===VERSION&&Array.isArray(s.log)&&Array.isArray(s.flags)&&Array.isArray(s.asked)&&Array.isArray(s.completedActionIds)&&typeof s.stage==='string';}
function reconcile(state,time){let s=copy(state);if(!valid(s))return create(time);if(s.pending&&time>=s.pending.dueAt&&!s.completedActionIds.includes(s.pending.id)){
 const a=s.pending;const act=(ACTIONS[a.fromStage]||[]).find(x=>x.id===a.choiceId);if(!act){s.pending=null;append(s,'system','The previous action could not be restored. No story state was changed.',time);return s;}
 s.completedActionIds.push(a.id);s.pending=null;s.stage=act.stage;s.maze=act.maze;s.location=act.location;s.flags=[...new Set([...s.flags,...act.flags])];if(act.id==='take')s.thread='held';
 append(s,'asterion',act.returns,a.dueAt);if(act.end){append(s,'system','OPENING SLICE COMPLETE · '+act.end,a.dueAt);}
 }
 return s;
}
function choose(state,choiceId,time){let s=reconcile(state,time);if(s.pending||s.stage==='complete')return s;
 const a=(ACTIONS[s.stage]||[]).find(x=>x.id===choiceId);if(!a)return s;
 append(s,'player',a.label,time);append(s,'asterion',a.depart,time);
 const id='away-'+(++s.seq);const durationMs=Math.min(MAX_WAIT,Math.max(1000,Math.round(a.minutes*60000)));
 s.pending={id,fromStage:s.stage,choiceId:a.id,durationMs,startedAt:time,dueAt:time+durationMs};s.stage='waiting';return s;
}
function ask(state,topic,time){let s=reconcile(state,time);if(s.pending||s.stage==='complete'||s.asked.includes(topic))return s;if(topic==='proof'&&!s.asked.includes('builder'))return s;
 const q=HISTORY[topic];if(!q)return s;append(s,'player',q.player,time);append(s,'asterion',q.response,time);s.asked.push(topic);return s;
}
function choices(s){return s.pending||s.stage==='complete'?[]:(ACTIONS[s.stage]||[]).map(x=>({id:x.id,label:x.label,durationMs:Math.round(x.minutes*60000)}));}
root.AsterionCore={VERSION,MAX_WAIT,create,valid,reconcile,choose,ask,choices};
})(window);
</script>
<script>
(function(){
'use strict';const C=window.AsterionCore,KEY='ebs_asterion_living_labyrinth_slice_v1';const screen=document.getElementById('screen'),maze=document.getElementById('labyrinth');let playing=false,showQuestions=false;
function read(){try{const data=JSON.parse(localStorage.getItem(KEY));return C.valid(data)?data:null;}catch{return null;}}
let state=read();const qa=new URLSearchParams(location.search).has('qa');
function persist(){try{localStorage.setItem(KEY,JSON.stringify(state));}catch{}}
function e(s){return String(s).replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));}
function when(ms){if(ms<60*1000)return Math.max(1,Math.ceil(ms/1000))+' seconds';return Math.ceil(ms/60000)+' minutes';}
function finishReview(){const was=state?.pending?.id;state=C.reconcile(state,Date.now());if(was&&!state.pending){persist();return true}return false;}
function render(){if(playing&&state)finishReview();maze.dataset.maze=state?.maze||'still';if(!playing){screen.className='screen home';screen.innerHTML='<div class="home-brand">ECHO BELOW STUDIO™ · BENEATH THE MYTH</div><section class="home-body"><div class="seal" aria-hidden="true"><span>Α</span></div><div class="eyebrow">THE LIVING LABYRINTH</div><h1>ASTERION</h1><h2>CHAPTER ONE · WEST PASSAGE</h2><p>Someone is still inside. The stone remembers more than the story does.</p></section><div class="home-actions"><button class="cta" data-action="enter">'+(state?'CONTINUE CONVERSATION':'ESTABLISH CONTACT')+'</button>'+(state?'<button class="secondary" data-action="restart">BEGIN A NEW STORY</button>':'')+'<p class="small">First playable slice. Saves only in this browser. Timed departures use real elapsed time.</p></div>';return;}
 const status=state.pending?'AWAY · '+e(state.pending.choiceId.replaceAll('-',' ').toUpperCase()):state.stage==='complete'?'OPENING SLICE COMPLETE':'CONNECTED';
 const labels={'still':'STONE STILL','watching':'WALLS WATCHING','sealed':'PASSAGE SEALED','listening':'STONE MOVING','redirecting':'PASSAGES SHIFTED','thread-held':'ARCH SEALED · THREAD HELD','awake':'STONE ANSWERING'};
 const tail=screen.querySelector('.transcript');const nearBottom=tail&&tail.scrollHeight-tail.scrollTop-tail.clientHeight<90;
 screen.className='screen';screen.innerHTML='<header class="top"><button data-action="home" aria-label="Return to title">HOME</button><div class="top-title"><strong>ASTERION</strong><span>CHAPTER I · WEST PASSAGE</span></div><button data-action="motion">'+(matchMedia('(prefers-reduced-motion: reduce)').matches?'STILL':'STONE')+'</button></header><div class="statebar"><span class="light"></span><span>'+status+'</span><span>'+e(labels[state.maze]||state.maze.toUpperCase())+'</span></div><section class="transcript" id="transcript" aria-live="polite">'+state.log.map(m=>'<article class="msg '+e(m.who==='player'?'player':m.who==='system'?'system':'asterion')+'"><div class="who">'+(m.who==='system'?'':m.who==='player'?'YOU':'ASTERION')+'</div><div class="bubble">'+e(m.text)+'</div></article>').join('')+'</section><section class="dock" id="dock"></section>';
 const dock=document.getElementById('dock');if(state.pending){const left=Math.max(0,state.pending.dueAt-Date.now());dock.innerHTML='<div class="dock-title">CHANNEL TEMPORARILY QUIET</div><div class="away"><strong>Asterion is away.</strong> He will contact you when his task is complete.<div class="soft">Approximate remaining time: '+when(left)+'. You can close the game and return later.</div>'+(qa?'<button class="debug" data-action="finishqa">TEST ONLY · SIMULATE RETURN</button>':'')+'</div>';
 }else if(state.stage==='complete'){dock.innerHTML='<div class="dock-title">THE STORY CONTINUES BEYOND THIS PROTOTYPE</div><div class="epilogue">This first playable section tests consequences, persistent timing, optional history, and a responsive labyrinth. It is not the completed full game.</div><button class="secondary" data-action="restart">RESTART THIS SLICE</button>';
 }else{let options=C.choices(state);dock.innerHTML='<div class="dock-title">YOUR RESPONSE</div><div class="choices">'+options.map(c=>'<button class="choice" data-choice="'+e(c.id)+'">'+e(c.label)+'</button>').join('')+'</div><div class="lore"><button class="linkbtn" data-action="questions" aria-expanded="'+showQuestions+'">'+(showQuestions?'− Close optional questions':'+ Ask Asterion a question')+'</button>'+(showQuestions?'<div class="question-list">'+(!state.asked.includes('why')?'<button data-question="why">Why are you here?</button>':'')+(!state.asked.includes('builder')?'<button data-question="builder">Did Daedalus build this place?</button>':'')+(state.asked.includes('builder')&&!state.asked.includes('proof')?'<button data-question="proof">How do you know the corridors are older?</button>':'')+'</div>':'')+'</div>';}
 const scroll=document.getElementById('transcript');if(nearBottom||!tail)scroll.scrollTop=scroll.scrollHeight;
}
function reset(){if(!confirm('Restart this prototype? Its local progress will be replaced.'))return;state=C.create(Date.now());persist();playing=true;showQuestions=false;render();}
screen.addEventListener('click',ev=>{const el=ev.target.closest('button');if(!el)return;const act=el.dataset.action;if(act==='enter'){if(!state){state=C.create(Date.now());persist()}playing=true;render();return}if(act==='restart'){reset();return}if(act==='home'){playing=false;showQuestions=false;render();return}if(act==='questions'){showQuestions=!showQuestions;render();return}if(act==='motion'){document.documentElement.classList.toggle('no-motion');el.textContent=document.documentElement.classList.contains('no-motion')?'STILL':'STONE';return}if(act==='finishqa'&&qa&&state?.pending){state=C.reconcile(state,state.pending.dueAt+1);persist();render();return}if(el.dataset.question){state=C.ask(state,el.dataset.question,Date.now());persist();render();return}if(el.dataset.choice){state=C.choose(state,el.dataset.choice,Date.now());persist();showQuestions=false;render();return}});
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&playing)render()});window.addEventListener('focus',()=>{if(playing)render()});setInterval(()=>{if(playing&&state?.pending){if(finishReview())render();else{const t=document.querySelector('.away .soft');if(t)t.textContent='Approximate remaining time: '+when(Math.max(0,state.pending.dueAt-Date.now()))+'. You can close the game and return later.';}}},1000);
render();
})();
</script>
